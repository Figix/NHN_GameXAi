<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신의 언어 (가제) — 레이아웃 뼈대</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="intro-overlay">
  <div id="intro-lines"></div>
</div>

<div id="app">
  <aside id="info-panel">
    <section id="riddle-box">
      <p class="label">신은 말한다</p>
      <p id="riddle-text">시간을 / 노래하는 / 마지막 / 심장</p>
      <div id="hint-buttons">
        <button id="object-hint-button" type="button">사물 힌트 (3)</button>
        <button id="location-hint-button" type="button">장소 힌트</button>
      </div>
    </section>
    <div id="log"></div>
  </aside>

  <main id="scene-view">
    <div id="tab-row">
      <nav id="place-switcher"></nav>
      <nav id="scene-switcher"></nav>
    </div>
    <div id="scene-frame">
      <div id="scene-bg"></div>
      <div id="dim-overlay"></div>
      <p id="continue-prompt">( 클릭하여 다음으로 )</p>
      <div id="place-transition"></div>
    </div>
  </main>
</div>

<button id="codex-toggle" type="button" aria-label="진명 기록">☰</button>
<div id="codex-overlay">
  <div id="codex-panel">
    <div id="codex-header">
      <p class="label">진명 기록</p>
      <p id="codex-progress"></p>
      <button id="codex-close" type="button" aria-label="닫기">×</button>
    </div>
    <div id="sound-settings">
      <label class="sound-row">
        <span>앰비언스</span>
        <input type="range" id="ambience-volume-slider" min="0" max="100" step="5">
      </label>
      <label class="sound-row">
        <span>효과음</span>
        <input type="range" id="sfx-volume-slider" min="0" max="100" step="5">
      </label>
    </div>
    <div id="codex-list"></div>
  </div>
</div>
<script src="js/intro.js"></script>
<script src="js/messages.js"></script>
<script src="js/rewards.js"></script>
<script src="js/endings.js"></script>
<script src="js/game.js"></script>
</body>
</html>
